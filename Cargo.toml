[package]
name = "atomos"
version = "0.1.0"
edition = "2021"
# fds-core (path dep) requires rustc 1.97.1 — the engine this crate builds on.
rust-version = "1.97.1"
license = "MIT"
description = "Barebones HTTP kernel: disjoint JSON rules, modules, atoms, operator CLI."
readme = "README.md"
keywords = ["http", "http2", "http3", "server"]
categories = ["network-programming", "web-programming::http-server"]

[lib]
name = "atomos"
path = "src/lib.rs"

[[bin]]
name = "atomos"
path = "src/bin/serve.rs"

[[bin]]
name = "atomos-ctl"
path = "src/bin/ctl.rs"

[[bin]]
name = "atomos-sup"
path = "src/bin/sup.rs"

[[bin]]
name = "atomos-proto"
path = "src/bin/proto.rs"

[[example]]
name = "static_site"
path = "examples/static_site.rs"

[[example]]
name = "echo_api"
path = "examples/echo_api.rs"

[[example]]
name = "first_app"
path = "examples/first_app.rs"

[[example]]
name = "loadgen"
path = "examples/loadgen.rs"

[dependencies]
arc-swap = "1"
bytes = "1"
dtoa = "1"
# FDS transport engine (sibling repo): the epoll H1 engine's reactor,
# TCP transport, connection table, and pinning come from here. Features
# off: the H1 engine uses the epoll reactor only (io_uring/AF_XDP/SCTP
# are the FDS engine's experimental paths, unused by atomos).
fds-core = { path = "../FDS/crates/fds-core", default-features = false }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hashbrown = "0.15"
http = "1"
httparse = "1"
itoa = "1"
libc = "0.2"
parking_lot = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
wasmtime = { version = "24", optional = true, default-features = false, features = ["runtime", "component-model", "cranelift"] }

[features]
default = ["h1"]
h1 = []
proto = []
wasm = ["dep:wasmtime"]

[[bin]]
name = "atomos-keyd"
path = "src/bin/keyd.rs"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
incremental = false
panic = "abort"

# Microbenches: opt-3, no LTO. Release stays thin LTO.
[profile.bench]
opt-level = 3
lto = false
codegen-units = 16
incremental = true
debug = false
