[package]
name = "mol"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["XENOT Corporation"]
description = "Mol: the category of stateful transformations. Atom and molecule framework for zero-allocation dataplanes (FDS)."

[lib]
name = "mol"

[dependencies]
heapless = "0.8"
arrayvec = "0.7"
static_assertions = "1.1"
rustix = { version = "1", features = ["mm"] }

[dev-dependencies]
