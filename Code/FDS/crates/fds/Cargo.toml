[package]
name = "fds"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["XENOT Corporation"]
description = "FDS transport library: nonblocking edge-triggered TCP, UDP, and SCTP dataplane on the Mol framework (Linux)."

[lib]
name = "fds"
path = "src/lib.rs"

[dependencies]
mol = { path = "../mol" }
libc = "0.2"
rustix = { version = "1", features = ["net", "mm", "process", "event", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
static_assertions = "1.1"

[features]
# Default features match the measured FDS engine. Atomos disables them
# (H1 uses the epoll reactor; io_uring, AF_XDP, and SCTP stay optional).
# sctp: FFI declared in-crate; links libsctp (pkg-config libsctp).
# io-uring: completion-driven reactor; io-uring crate (pure syscall).
# af-xdp: zero-copy raw-Ethernet path; needs an XDP-attached device.
default = ["sctp", "io-uring", "af-xdp"]
sctp = []
io-uring = ["dep:io-uring"]
af-xdp = []

[dependencies.io-uring]
version = "0.7"
optional = true
