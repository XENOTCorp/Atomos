worker_processes 4;
error_log /tmp/atomos-bench-nginx.err crit;
pid /tmp/atomos-bench-nginx.pid;
events { worker_connections 4096; }
http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 75s;
  open_file_cache max=1000 inactive=60s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 1;
  open_file_cache_errors on;
  server {
    listen 18092 reuseport;
    server_name _;
    root ROOT;
    location /11b { alias ROOT/11b; }
    location /64k { alias ROOT/64k; }
    location /1m { alias ROOT/1m; }
    location / { try_files $uri $uri/ =404; }
  }
}
