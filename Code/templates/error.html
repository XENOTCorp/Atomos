<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{code}} {{phrase}}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#c8cdd3;font:13px/1.45 ui-sans-serif,system-ui,sans-serif;min-height:100%}
body{max-width:640px;margin:0 auto;padding:48px 20px}
.metal{font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:18px;
background:linear-gradient(105deg,#5c5c5c 0%,#cfcfcf 18%,#f7f7f7 36%,#9a9a9a 50%,#ececec 64%,#7a7a7a 82%,#d8d8d8 100%);
-webkit-background-clip:text;background-clip:text;color:transparent}
.code{font-size:42px;font-weight:500;color:#edeff2;margin:28px 0 8px;font-variant-numeric:tabular-nums}
.phrase{letter-spacing:.16em;text-transform:uppercase;color:#8b9096;font-size:11px}
.detail{margin-top:18px;color:#6e7378;font-size:12px;border-top:1px solid #1a1a1a;padding-top:14px}
</style>
</head>
<body>
<div class="metal">ATOMOS</div>
<div class="code">{{code}}</div>
<div class="phrase">{{phrase}}</div>
<p class="detail">{{detail}}</p>
</body>
</html>
