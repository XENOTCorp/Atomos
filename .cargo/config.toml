# Environment RUSTFLAGS overrides this — unset it if the host injects mold.
# `native` on XENOT compute is Broadwell (AVX2, no AVX-512).

[build]
rustflags = [
  "-C", "target-cpu=native",
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-Wl,-z,relro,-z,now,-z,noexecstack",
]

[target.x86_64-unknown-linux-gnu]
linker = "cc"
rustflags = [
  "-C", "target-cpu=native",
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-Wl,-z,relro,-z,now,-z,noexecstack",
]
